name: CD

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/only-talk-rs:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/only-talk-rs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "$HOME/only-talk-rs-deploy"
            git pull --ff-only
            echo "${{ secrets.DEPLOY_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd deploy

            # 先拉取新镜像, 再停旧应用: 在线应用可能持有 basic_user 等表的锁,
            # 会阻塞 DDL 中的 ALTER TABLE 直到 SSH action 10 分钟超时。
            docker-compose pull app
            docker-compose stop app || true

            # 无论 DDL 成败都恢复应用, 避免迁移失败时服务一直下线
            trap 'docker-compose up -d app' EXIT

            # 应用数据库 DDL: 脚本均已幂等(IF NOT EXISTS / DO 块), 可安全重复执行;
            # 先建表, 再启动新版本镜像, 避免新代码查询不存在的表。
            # PGOPTIONS 设置 lock_timeout: 万一仍有锁竞争, 30s 快速失败而不是挂到 10 分钟超时。
            # ddl 目录已只读挂载到 postgres 容器 /docker-entrypoint-initdb.d, 在容器内按字典序重放即可。
            docker-compose exec -T -e PGOPTIONS='-c lock_timeout=30s' postgres sh -c 'for f in /docker-entrypoint-initdb.d/*.sql; do echo "==> 应用 DDL: $f"; psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -q -f "$f"; done'
