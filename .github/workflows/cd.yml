name: CD

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/only-talk-rs:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/only-talk-rs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "$HOME/only-talk-rs-deploy"
            git pull --ff-only
            echo "${{ secrets.DEPLOY_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd deploy

            # 应用数据库 DDL: 脚本均已幂等(IF NOT EXISTS / ON CONFLICT DO NOTHING), 可安全重复执行;
            # 先建表, 再启动新版本镜像, 避免新代码查询不存在的表
            for f in "$HOME"/only-talk-rs-deploy/crates/entity/ddl/*.sql; do
              echo "==> 应用 DDL: $f"
              docker compose exec -T postgres \
                sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -q' < "$f"
            done

            docker-compose pull app
            docker-compose up -d app
