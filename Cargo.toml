[package]
name = "only_talk_rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/entity",
    "crates/common",
    "crates/http_service",
    "crates/quic_service",
    "crates/api",
    "crates/email_service",
    "crates/s3_service"
]

[dependencies.quic_service]
path = "crates/quic_service"

[dependencies.api]
path = "crates/api"

[workspace.dependencies]
quinn = {version = "0.10.2"}
rustls = { version = "0.21", features = ["dangerous_configuration"] }
jsonwebtoken = "8.0"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-actix-web = "0.7"
serde = { version = "1", features = ["derive"] }
lazy_static = "1.4"
redis = { version = "0.22" ,features = ["tokio-comp"]}
actix-files = "0.6"
actix-web = { version = "4.15", features = ["rustls-0_21"] }
deadpool-redis = "0.18.0"
rustls-pemfile = "1.0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
anyhow = "1.0"
validator = { version = "0.16", features = ["derive"] }
rbs = { version = "=4.6.2" }
rbatis = { version = "=4.6.7", features = ["debug_mode"] }
toml = "0.8.19"
rbdc-pg = { version = "=4.6.1" }
rbdc-pool-fast = "=4.6.0"
once_cell = "1.21.4"
regex = "1.11.0"
rsa = "0.9.7"
rand = "0.8.5"
sha2 = "0.10.8"
bincode = "1.3.3"
crc = { version = "3.4" }
crc-catalog = "2.0"  # 可选，用于预置标准CRC算法
nanoid = "0.4.0"
async-trait = "0.1.89"
actix-multipart = "0.6"
futures-util = "0.3"
webpki-roots = "1.0.9"
x509-parser = "0.16"
rcgen = "0.13"
dotenvy = "0.15"
futures = "0.3.31"
dashmap = "6.1"
thiserror = "2.0"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = "0.11"
base64 = "0.22"
hmac = "0.12"
hex = "0.4"
parking_lot = "0.12"
backoff = "0.4"
urlencoding = "2.1"
mime = "0.3"
image = "0.25"
webp = "0.3"
bytes = "1"
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
tokio-test = "0.4"
actix-http = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[dependencies]
common = { path = "crates/common" }
tracing = { workspace = true }
actix-web = { workspace = true }
tokio = { workspace = true }
dotenvy = { workspace = true }

